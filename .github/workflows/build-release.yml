name: Build firmware and publish release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure cores
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli core install esp8266:esp8266

      - name: Install libraries
        run: |
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "RGB matrix Panel"
          arduino-cli lib install "U8g2_for_Adafruit_GFX"

      - name: Prepare sketches
        run: |
          mkdir -p build/sketches/mega build/sketches/esp8266
          cp firmware/mega/anenji_rgb_display.ino build/sketches/mega/mega.ino
          cp firmware/esp8266/anenji_esp8266_bridge_stage1_grid_present.ino build/sketches/esp8266/esp8266.ino

      - name: Compile Mega 2560
        run: |
          mkdir -p build/out/mega
          arduino-cli compile --fqbn arduino:avr:mega --output-dir build/out/mega build/sketches/mega

      - name: Compile ESP8266
        run: |
          mkdir -p build/out/esp8266
          arduino-cli compile --fqbn esp8266:esp8266:generic --output-dir build/out/esp8266 build/sketches/esp8266

      - name: Package firmware
        run: |
          mkdir -p dist
          find build/out/mega -maxdepth 1 -name "*.hex" -print
          mega_hex=$(find build/out/mega -maxdepth 1 -name "*.hex" ! -name "*with_bootloader*" -print -quit)
          test -n "$mega_hex"
          cp "$mega_hex" dist/anenji-mega2560.hex
          cp build/out/esp8266/*.bin dist/anenji-esp8266.bin
          sha256sum dist/* > dist/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anenji-firmware
          path: dist/

      - name: Determine automatic release version
        id: auto_release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          # Do not release on documentation-only or workflow-only commits.
          latest_tag=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)
          if [[ -n "$latest_tag" ]]; then
            changed=$(git diff --name-only "$latest_tag" HEAD -- firmware/mega/ firmware/esp8266/)
          else
            changed=$(git ls-files firmware/mega/ firmware/esp8266/)
          fi
          if [[ -z "$changed" ]]; then
            echo 'No firmware changes since last release; skipping.'
            exit 0
          fi
          if [[ -z "$latest_tag" ]]; then
            new_tag='v0.1.0'
          elif [[ "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            new_tag="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((10#${BASH_REMATCH[3]} + 1))"
          else
            echo "Unsupported version tag: $latest_tag" >&2
            exit 1
          fi
          # A tag push using GITHUB_TOKEN does not trigger another workflow;
          # publish the release in this same job.
          if git ls-remote --exit-code --tags origin "refs/tags/$new_tag" >/dev/null 2>&1; then
            echo "Tag $new_tag already exists; refusing to overwrite." >&2
            exit 1
          fi
          git tag "$new_tag" "${GITHUB_SHA}"
          git push origin "refs/tags/$new_tag"
          echo "tag=$new_tag" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || steps.auto_release.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.auto_release.outputs.tag || github.ref_name }}
          files: |
            dist/anenji-mega2560.hex
            dist/anenji-esp8266.bin
            dist/SHA256SUMS.txt
          generate_release_notes: true
